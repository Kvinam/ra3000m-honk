name: Audit RAX3000M NAND Source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout config repository
        uses: actions/checkout@v4

      - name: Validate local NAND-only profile
        shell: pwsh
        run: ./scripts/verify-nand-profile.ps1

      - name: Restore OpenWrt Git object cache
        id: openwrt-git-cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/git/openwrt-source.git
          key: git-openwrt-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            git-openwrt-v1-${{ runner.os }}-

      - name: Checkout pinned source and audit NAND profile
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/checkout-pinned-source.sh \
            https://github.com/shiyu1314/openwrt-source v25.12.6 \
            dc327b29f23cbee6c4dc41fef63656db0f7dba38 \
            /home/runner/.cache/git/openwrt-source.git source
          echo "Checked source commit: $(git -C source rev-parse HEAD)"
          cd source
          DTS=target/linux/mediatek/dts/mt7981b-cmcc-rax3000m-nand.dts
          OVERLAY=target/linux/mediatek/dts/mt7981b-cmcc-rax3000m-nand.dtso
          RECIPE=target/linux/mediatek/image/filogic.mk
          TARGET=target/linux/mediatek/Makefile
          test -f "$DTS"
          test -f "$OVERLAY"
          test -f "$RECIPE"
          grep -Fq 'model = "CMCC RAX3000M (NAND version)";' "$DTS"
          grep -Fq 'compatible = "cmcc,rax3000m-nand", "mediatek,mt7981";' "$DTS"
          grep -Fq 'label = "bl2";' "$DTS"
          grep -Fq 'reg = <0x00000 0x0100000>;' "$DTS"
          grep -Fq 'label = "u-boot-env";' "$DTS"
          grep -Fq 'reg = <0x100000 0x80000>;' "$DTS"
          grep -Fq 'label = "factory";' "$DTS"
          grep -Fq 'reg = <0x180000 0x200000>;' "$DTS"
          grep -Fq 'label = "fip";' "$DTS"
          grep -Fq 'reg = <0x380000 0x200000>;' "$DTS"
          grep -Fq 'label = "ubi";' "$DTS"
          grep -Fq 'reg = <0x580000 0x7200000>;' "$DTS"
          grep -Fq 'rootdisk = <&ubi_rootdisk>;' "$OVERLAY"
          grep -Fq 'volname = "fit";' "$OVERLAY"
          grep -Fq 'define Device/cmcc_rax3000m-nand' "$RECIPE"
          grep -Fq 'DEVICE_DTS := mt7981b-cmcc-rax3000m-nand' "$RECIPE"
          grep -Fq 'UBINIZE_OPTS := -E 5' "$RECIPE"
          grep -Fq 'BLOCKSIZE := 128k' "$RECIPE"
          grep -Fq 'PAGESIZE := 2048' "$RECIPE"
          grep -Fq 'IMAGE_SIZE := 116736k' "$RECIPE"
          grep -Fq 'KERNEL_IN_UBI := 1' "$RECIPE"
          grep -Fq 'TARGET_DEVICES += cmcc_rax3000m-nand' "$RECIPE"
          grep -Fq 'IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata' "$RECIPE"
          grep -Fq 'KERNEL_PATCHVER:=6.12' "$TARGET"
          echo 'NAND RAX3000M DTS/partition/UBI/image/kernel checks passed.'
          echo 'Audit only: no firmware build, upload, or flashing.'

      - name: Save OpenWrt Git object cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/git/openwrt-source.git
          key: git-openwrt-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
