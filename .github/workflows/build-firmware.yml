name: Build RAX3000M NAND Honk Full Firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-firmware.yml'

permissions:
  contents: read

concurrency:
  group: rax3000m-nand-firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Clone pinned ImmortalWrt source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=https://github.com/shiyu1314/openwrt-source
          REF=v25.12.6
          EXPECTED=8a3b1e99b158d88104dc8aecf1c98721ef87f3a3
          git clone --filter=blob:none --no-checkout "$SOURCE" source
          git -C source fetch --depth=1 origin "$REF"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"

      - name: Verify and prepare RAX3000M NAND and Honk Full
        shell: bash
        run: |
          set -euo pipefail
          cd source
          IMAGE_FILE=target/linux/mediatek/image/filogic.mk
          DTS_FILE=target/linux/mediatek/dts/mt7981b-cmcc-rax3000m-nand.dts
          grep -q '^define Device/cmcc_rax3000m-nand$' "$IMAGE_FILE"
          grep -q '^TARGET_DEVICES += cmcc_rax3000m-nand$' "$IMAGE_FILE"
          grep -q 'DEVICE_DTS := mt7981b-cmcc-rax3000m-nand' "$IMAGE_FILE"
          test -f "$DTS_FILE"
          cp ../scripts/prepare-honk-build.sh scripts/
          cp ../config/kernel-bpf.fragment config/
          cp ../config/diffconfig config/
          chmod +x scripts/prepare-honk-build.sh
          bash scripts/prepare-honk-build.sh

      - name: Update and install feeds
        shell: bash
        run: |
          set -euo pipefail
          cd source
          ./scripts/feeds update -a 2>&1 | tee feeds-update.log
          ./scripts/feeds install -a 2>&1 | tee feeds-install.log

      - name: Configure target and packages
        shell: bash
        run: |
          set -euo pipefail
          cd source
          cp config/diffconfig .config
          make defconfig 2>&1 | tee defconfig.log
          grep -qx 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m-nand=y' .config
          grep -qx 'CONFIG_PACKAGE_honk=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-honk=y' .config
          ! grep -qx 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m-emmc=y' .config
          ! grep -qx 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m-256m-nand=y' .config

      - name: Download build sources
        shell: bash
        run: |
          set -euo pipefail
          cd source
          make download -j2 2>&1 | tee download.log

      - name: Compile firmware (conservative parallelism)
        shell: bash
        run: |
          set -euo pipefail
          cd source
          make -j2 2>&1 | tee build.log

      - name: Upload RAX3000M NAND firmware images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RAX3000M-NAND-Honk-Full-firmware
          path: source/bin/targets/mediatek/filogic/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Upload build logs and configuration on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rax3000m-nand-build-diagnostics
          path: |
            source/.config
            source/feeds-update.log
            source/feeds-install.log
            source/defconfig.log
            source/download.log
            source/build.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7