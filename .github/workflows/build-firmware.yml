name: Build RAX3000M NAND Honk Firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-firmware.yml'

permissions:
  contents: read

concurrency:
  group: rax3000m-nand-firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools python3-dev rsync unzip zlib1g-dev file wget curl libelf-dev libxml-parser-perl libintl-perl

      - name: Clone pinned source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/shiyu1314/openwrt-source source
          git -C source fetch --depth=1 origin v25.12.6
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "8a3b1e99b158d88104dc8aecf1c98721ef87f3a3"
          echo "SOURCE_COMMIT=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify NAND profile and DTS
        shell: bash
        run: |
          set -euo pipefail
          cd source
          image_file=target/linux/mediatek/image/filogic.mk
          dts_file=target/linux/mediatek/dts/mt7981b-cmcc-rax3000m-nand.dts
          grep -q '^define Device/cmcc_rax3000m-nand$' "$image_file"
          grep -q '^TARGET_DEVICES += cmcc_rax3000m-nand$' "$image_file"
          grep -q 'DEVICE_DTS := mt7981b-cmcc-rax3000m-nand' "$image_file"
          test -f "$dts_file"
          echo "PASS: exact RAX3000M NAND image profile and DTS"

      - name: Prepare Honk feed and BPF/BTF kernel config
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/prepare-honk-build.sh source/scripts/
          cp config/kernel-bpf.fragment source/config/
          cp config/diffconfig source/config/
          chmod +x source/scripts/prepare-honk-build.sh
          cd source
          bash scripts/prepare-honk-build.sh

      - name: Update and install feeds
        shell: bash
        run: |
          set -euo pipefail
          cd source
          ./scripts/feeds update -a 2>&1 | tee feeds-update.log
          ./scripts/feeds install -a 2>&1 | tee feeds-install.log

      - name: Configure and verify NAND target
        shell: bash
        run: |
          set -euo pipefail
          cd source
          cp config/diffconfig .config
          make defconfig 2>&1 | tee defconfig.log
          grep -qx 'CONFIG_TARGET_mediatek=y' .config
          grep -qx 'CONFIG_TARGET_mediatek_filogic=y' .config
          grep -qx 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m-nand=y' .config
          grep -qx 'CONFIG_PACKAGE_honk=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-honk=y' .config
          grep -qx 'CONFIG_PACKAGE_vmlinux-btf-builtin=y' .config
          for forbidden in CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m-emmc CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m-256m-nand; do
            if grep -qx "${forbidden}=y" .config; then
              echo "Forbidden device profile enabled: ${forbidden}" >&2
              exit 1
            fi
          done
          cp .config config-build-final.config

      - name: Download source archives
        shell: bash
        run: |
          set -euo pipefail
          cd source
          make download -j8 2>&1 | tee download.log

      - name: Compile firmware
        shell: bash
        run: |
          set -euo pipefail
          cd source
          make -j$(nproc) 2>&1 | tee build.log

      - name: Verify and collect firmware artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp source/config-build-final.config artifacts/ 2>/dev/null || true
          cp source/feeds-update.log source/feeds-install.log source/defconfig.log source/download.log source/build.log artifacts/ 2>/dev/null || true
          if [[ -d source/bin/targets/mediatek/filogic ]]; then
            cp -a source/bin/targets/mediatek/filogic/. artifacts/
          fi
          echo "--- output files ---"
          find artifacts -maxdepth 2 -type f -printf '%f %s bytes\n' || true
          if [[ "${{ job.status }}" == "success" ]]; then
            if ! find artifacts -type f \( -name '*sysupgrade*' -o -name '*cmcc*' \) | grep -q .; then
              echo "ERROR: No sysupgrade image artifact was found." >&2
              exit 1
            fi
          fi

      - name: Upload firmware and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rax3000m-nand-honk-firmware
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14