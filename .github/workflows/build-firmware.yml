name: Build RAX3000M NAND Honk Firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-firmware.yml'
      - 'config/diffconfig'
      - 'config/kernel-bpf.fragment'
      - 'scripts/prepare-honk-build.sh'
      - 'config/build-deps.txt'
      - 'scripts/checkout-pinned-source.sh'
      - 'scripts/checkout-pinned-commit.sh'
      - 'scripts/update-feeds-cache.sh'

permissions:
  contents: read

concurrency:
  group: rax3000m-nand-firmware-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_COMMIT: dc327b29f23cbee6c4dc41fef63656db0f7dba38
  SOURCE_REF: v25.12.6
  OVERLAY_COMMIT: 3e9480c061bcc92f6fa260920b189c22a6f04a9b
  HONK_COMMIT: e104a4930c5fc4f625f3355257626495685424f5
  HONK_SOURCE_COMMIT: 64848881b7304e250e7a25422f4f1d86a5975eca

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Restore APT package archives
        id: apt-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/apt-archives
          key: apt-debs-v1-${{ runner.os }}-ubuntu24-${{ hashFiles('config/build-deps.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            apt-debs-v1-${{ runner.os }}-ubuntu24-${{ hashFiles('config/build-deps.txt') }}-
            apt-debs-v1-${{ runner.os }}-ubuntu24-

      - name: Restore APT package index cache
        id: apt-index-cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/apt-lists
          key: apt-index-v1-${{ runner.os }}-ubuntu24-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            apt-index-v1-${{ runner.os }}-ubuntu24-

      - name: Install build dependencies (cached deb archives and package indexes)
        id: apt-install
        shell: bash
        run: |
          set -euo pipefail
          APT_CACHE=/home/runner/.cache/apt-archives
          APT_LIST_CACHE=/home/runner/.cache/apt-lists
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          sudo install -d -o "$RUNNER_UID" -g "$RUNNER_GID" -m 0755 "$APT_CACHE" "$APT_CACHE/partial" "$APT_LIST_CACHE" "$APT_LIST_CACHE/partial"
          sudo chown -R "$RUNNER_UID:$RUNNER_GID" "$APT_CACHE"
          sudo chmod -R u+rwX "$APT_CACHE"
          sudo find "$APT_CACHE/partial" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          sudo rm -f "$APT_CACHE/lock" "$APT_LIST_CACHE/lock"
          mapfile -t PACKAGES < config/build-deps.txt

          # GitHub-hosted Ubuntu runners may inject a region-specific EC2 mirror
          # through apt-mirrors.txt. #9 showed repeated Ign/timeouts on that host
          # while archive.ubuntu.com was reachable; pin that entry to the working
          # canonical HTTPS mirror before refreshing package indexes.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            echo "APT mirror list before normalization:"
            cat /etc/apt/apt-mirrors.txt
            sudo sed -i -E 's#https?://[^/]*\.archive\.ubuntu\.com/ubuntu/?#https://archive.ubuntu.com/ubuntu/#g' /etc/apt/apt-mirrors.txt
            echo "APT mirror list after normalization:"
            cat /etc/apt/apt-mirrors.txt
          fi

          APT_NETWORK_OPTS=(
            -o Acquire::Retries=2
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
            -o Acquire::http::Pipeline-Depth=0
          )

          echo "APT sources in use:"
          grep -RhsE '^(URIs:|Suites:|deb )' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true

          apt_retry() {
            local attempt=1
            while (( attempt <= 3 )); do
              if sudo timeout --signal=TERM --kill-after=20s 300s apt-get "${APT_NETWORK_OPTS[@]}" "$@"; then return 0; fi
              echo "APT attempt ${attempt}/3 failed; retrying after backoff"
              sleep $((attempt * 8))
              attempt=$((attempt + 1))
            done
            return 1
          }

          START=$SECONDS
          echo "Refreshing APT package indexes..."
          apt_retry -o Dir::State::lists="$APT_LIST_CACHE" update
          echo "APT update elapsed: $((SECONDS-START)) seconds"

          START=$SECONDS
          echo "Installing build dependencies..."
          apt_retry -o Dir::State::lists="$APT_LIST_CACHE" -o Dir::Cache::archives="$APT_CACHE" install -y "${PACKAGES[@]}"
          echo "APT install elapsed: $((SECONDS-START)) seconds"
          mkdir -p artifacts/logs
          dpkg-query -W -f='${binary:Package}=${Version}\n' "${PACKAGES[@]}" 2>/dev/null | sort > artifacts/logs/apt-package-versions.txt

      - name: Restore OpenWrt Git object cache
        id: openwrt-git-cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/git/openwrt-source.git
          key: git-openwrt-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            git-openwrt-v1-${{ runner.os }}-

      - name: Checkout pinned OpenWrt source using Git object cache
        shell: bash
        run: |
          set -euo pipefail
          START=$SECONDS
          bash scripts/checkout-pinned-source.sh \
            https://github.com/shiyu1314/openwrt-source \
            "$SOURCE_REF" "$SOURCE_COMMIT" \
            /home/runner/.cache/git/openwrt-source.git source
          echo "OpenWrt source checkout elapsed: $((SECONDS-START)) seconds"

      - name: Restore OpenWrt source archives (dl)
        id: dl-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: source/dl
          key: openwrt-dl-v3-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            openwrt-dl-v3-${{ runner.os }}-
            openwrt-dl-v2-${{ runner.os }}-
            openwrt-dl-v1-${{ runner.os }}-

      - name: Prepare ccache restore directory
        shell: bash
        run: |
          set -euo pipefail
          CACHE_PARENT=/home/runner/.cache
          CCACHE_DIR="$CACHE_PARENT/ccache"
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"

          # actions/cache extracts as the runner; make the extraction path
          # traversable and writable before restoring the archive.
          sudo install -d -o "$RUNNER_UID" -g "$RUNNER_GID" -m 0755 "$CACHE_PARENT"
          sudo install -d -o "$RUNNER_UID" -g "$RUNNER_GID" -m 0755 "$CCACHE_DIR"
          test -x "$CACHE_PARENT" && test -w "$CACHE_PARENT"
          test -x "$CCACHE_DIR" && test -w "$CCACHE_DIR"

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/ccache
          key: ccache-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-
            ccache-v1-${{ runner.os }}-${{ env.SOURCE_COMMIT }}-${{ env.HONK_COMMIT }}-

      - name: Repair and verify ccache permissions
        shell: bash
        run: |
          set -euo pipefail
          CCACHE_DIR=/home/runner/.cache/ccache
          CACHE_PARENT=/home/runner/.cache
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"

          echo "Runner identity: $(id)"
          echo "Permissions before repair:"
          namei -l "$CCACHE_DIR" || true

          # The restored Actions cache may contain entries owned by root or
          # another UID. Repair only the dedicated ccache tree, not $HOME.
          sudo install -d -o "$RUNNER_UID" -g "$RUNNER_GID" -m 0755 "$CACHE_PARENT"
          sudo install -d -o "$RUNNER_UID" -g "$RUNNER_GID" -m 0755 "$CCACHE_DIR"
          sudo chown -R "$RUNNER_UID:$RUNNER_GID" "$CCACHE_DIR"
          sudo chmod -R u+rwX "$CCACHE_DIR"
          chmod u+rwx "$CACHE_PARENT" "$CCACHE_DIR"

          # Verify both traversal and an actual create/delete operation.
          test -x "$CACHE_PARENT"
          test -w "$CACHE_PARENT"
          test -x "$CCACHE_DIR"
          test -w "$CCACHE_DIR"
          PROBE_FILE="$CCACHE_DIR/.permission-check-$$"
          : > "$PROBE_FILE"
          rm -f "$PROBE_FILE"

          echo "Permissions after repair:"
          namei -l "$CCACHE_DIR"
          echo "PASS: ccache directory is writable by $(id -un) (uid=$RUNNER_UID)"

      - name: Verify NAND profile and DTS
        shell: bash
        run: |
          set -euo pipefail
          cd source
          image_file=target/linux/mediatek/image/filogic.mk
          dts_file=target/linux/mediatek/dts/mt7981b-cmcc-rax3000m-nand.dts
          grep -q '^define Device/cmcc_rax3000m-nand$' "$image_file"
          grep -q '^TARGET_DEVICES += cmcc_rax3000m-nand$' "$image_file"
          grep -q 'DEVICE_DTS := mt7981b-cmcc-rax3000m-nand' "$image_file"
          test -f "$dts_file"
          echo "PASS: exact RAX3000M NAND image profile and DTS"

      - name: Prepare Honk feed and BPF/BTF kernel config
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/prepare-honk-build.sh source/scripts/
          cp scripts/update-feeds-cache.sh source/scripts/
          cp config/kernel-bpf.fragment source/config/
          cp config/diffconfig source/config/
          chmod +x source/scripts/prepare-honk-build.sh
          cd source
          bash scripts/prepare-honk-build.sh

      - name: Restore feeds repositories
        id: feeds-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: source/feeds
          key: feeds-v3-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            feeds-v3-${{ runner.os }}-
            feeds-v2-${{ runner.os }}-
            feeds-v1-${{ runner.os }}-

      - name: Update only changed feeds and install feed packages
        id: feeds-update-install
        shell: bash
        run: |
          set -euo pipefail
          cd source
          START=$SECONDS
          bash scripts/update-feeds-cache.sh
          echo "Selective feed update/install elapsed: $((SECONDS-START)) seconds"

      - name: Restore Honk Git object cache
        id: honk-git-cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/git/honk.git
          key: git-honk-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            git-honk-v1-${{ runner.os }}-

      - name: Checkout pinned Honk source using Git object cache
        shell: bash
        run: |
          set -euo pipefail
          HONK_SRC="source/feeds/daeuniverse/honk/src"
          mkdir -p "$(dirname "$HONK_SRC")"
          bash scripts/checkout-pinned-commit.sh \
            https://github.com/daeuniverse/honk "$HONK_SOURCE_COMMIT" \
            /home/runner/.cache/git/honk.git "$HONK_SRC"

      # Honk pins both the application and eBPF Rust toolchains. The stable
      # toolchain must include the OpenWrt target's core/std libraries; the
      # nested nightly toolchain builds the BPF object from rust-src.
      - name: Restore pinned Rust toolchains
        id: rustup-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.rustup/toolchains
          key: rustup-toolchains-v1-${{ runner.os }}-stable-1.99.1-nightly-2026-10-20-aarch64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rustup-toolchains-v1-${{ runner.os }}-stable-1.99.1-nightly-2026-10-20-aarch64-

      - name: Install pinned Honk Rust toolchains
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          target: aarch64-unknown-linux-musl

      - name: Install pinned Honk eBPF Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly-2026-10-20
          components: rust-src, llvm-tools

      - name: Restore Honk Cargo dependency cache
        id: honk-cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/.cargo/registry
            /home/runner/.cargo/git
          key: honk-cargo-v1-${{ runner.os }}-${{ hashFiles('source/feeds/daeuniverse/honk/Cargo.lock', 'source/feeds/daeuniverse/honk/crates/honk-ebpf/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            honk-cargo-v1-${{ runner.os }}-${{ hashFiles('source/feeds/daeuniverse/honk/Cargo.lock', 'source/feeds/daeuniverse/honk/crates/honk-ebpf/Cargo.lock') }}-

      - name: Restore pinned bpf-linker archive
        id: bpf-linker-cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/bpf-linker
          key: bpf-linker-v1-${{ runner.os }}-0.11.0-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bpf-linker-v1-${{ runner.os }}-0.11.0-

      - name: Install pinned bpf-linker
        shell: bash
        run: |
          set -euo pipefail
          BPF_LINKER_VERSION=0.11.0
          BPF_LINKER_SHA256=10f62ba9ab7e544d538370552660efcb4f1a19153d5752bbf0f6b51f3bada450
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          CACHE_DIR=/home/runner/.cache/bpf-linker
          ARCHIVE="$CACHE_DIR/bpf-linker-${BPF_LINKER_VERSION}.tar.zst"
          mkdir -p "$CACHE_DIR"
          if [[ -s "$ARCHIVE" ]] && ! echo "$BPF_LINKER_SHA256  $ARCHIVE" | sha256sum -c --status; then
            echo "Cached bpf-linker archive checksum mismatch; discarding it"
            rm -f "$ARCHIVE"
          fi
          if [[ ! -s "$ARCHIVE" ]]; then
            curl -fsSL --retry 3 --retry-all-errors -o "$ARCHIVE" \
              "https://github.com/aya-rs/bpf-linker/releases/download/v${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          fi
          echo "$BPF_LINKER_SHA256  $ARCHIVE" | sha256sum -c -
          mkdir -p "$CARGO_HOME/bin"
          zstd -dc "$ARCHIVE" | tar -xf - -C "$CARGO_HOME/bin"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          "$CARGO_HOME/bin/bpf-linker" --version

      - name: Verify Honk Rust cross toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.99.1 rustc --version
          rustup target list --toolchain 1.99.1 --installed
          rustup run 1.99.1 rustc --print target-libdir --target aarch64-unknown-linux-musl
          test -d "$(rustup run 1.99.1 rustc --print target-libdir --target aarch64-unknown-linux-musl)"
          rustup run nightly-2026-10-20 rustc --version
          bpf-linker --version
      - name: Configure and verify NAND target
        shell: bash
        run: |
          set -euo pipefail
          cd source
          cp config/diffconfig .config
          START=$SECONDS
          make defconfig 2>&1 | tee defconfig.log
          echo "Defconfig elapsed: $((SECONDS-START)) seconds"
          grep -qx 'CONFIG_TARGET_mediatek=y' .config
          grep -qx 'CONFIG_TARGET_mediatek_filogic=y' .config
          grep -qx 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m-nand=y' .config
          grep -qx 'CONFIG_PACKAGE_honk=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-honk=y' .config
          grep -qx 'CONFIG_PACKAGE_vmlinux-btf-builtin=y' .config
          grep -qx 'CONFIG_KERNEL_DEBUG_INFO=y' .config || { echo 'CONFIGURATION ERROR: CONFIG_KERNEL_DEBUG_INFO is not enabled after make defconfig.' >&2; exit 1; }
          grep -qx 'CONFIG_KERNEL_DEBUG_INFO_BTF=y' .config || { echo 'CONFIGURATION ERROR: CONFIG_KERNEL_DEBUG_INFO_BTF is not enabled after make defconfig.' >&2; exit 1; }
          grep -qx '# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set' .config || { echo 'CONFIGURATION ERROR: reduced debug info must be disabled for BTF.' >&2; exit 1; }
          echo "PASS: OpenWrt Kconfig enables full debug info and BTF; reduced debug info is disabled."
          grep -qx 'CONFIG_DEVEL=y' .config
          grep -qx 'CONFIG_CCACHE=y' .config
          grep -qx 'CONFIG_CCACHE_DIR="/home/runner/.cache/ccache"' .config
          for forbidden in CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m-emmc CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m-256m-nand; do
            if grep -qx "${forbidden}=y" .config; then
              echo "Forbidden device profile enabled: ${forbidden}" >&2
              exit 1
            fi
          done
          cp .config config-build-final.config

      - name: Write build-cache compatibility fingerprint
        shell: bash
        run: |
          set -euo pipefail
          INPUTS_SHA="$(sha256sum config/build-deps.txt config/diffconfig config/kernel-bpf.fragment scripts/prepare-honk-build.sh scripts/update-feeds-cache.sh artifacts/logs/apt-package-versions.txt source/.config source/.cache-feed-revisions | sha256sum | awk '{print $1}')"
          {
            echo "SOURCE_COMMIT=${SOURCE_COMMIT}"
            echo "OVERLAY_COMMIT=${OVERLAY_COMMIT}"
            echo "HONK_COMMIT=${HONK_COMMIT}"
            echo "HONK_SOURCE_COMMIT=${HONK_SOURCE_COMMIT}"
            echo "INPUTS_SHA256=${INPUTS_SHA}"
          } > source/.cache-build-fingerprint.expected

      - name: Cache compatible staging directory
        id: staging-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            source/staging_dir
            source/.cache-staging-fingerprint
          key: staging-v2-${{ runner.os }}-${{ env.SOURCE_COMMIT }}-${{ env.OVERLAY_COMMIT }}-${{ env.HONK_COMMIT }}-${{ env.HONK_SOURCE_COMMIT }}-${{ hashFiles('config/build-deps.txt', 'config/diffconfig', 'config/kernel-bpf.fragment', 'scripts/prepare-honk-build.sh', 'scripts/update-feeds-cache.sh', 'artifacts/logs/apt-package-versions.txt', 'source/.config', 'source/feeds.conf.default', 'source/.cache-feed-revisions') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            staging-v2-${{ runner.os }}-${{ env.SOURCE_COMMIT }}-${{ env.OVERLAY_COMMIT }}-${{ env.HONK_COMMIT }}-${{ env.HONK_SOURCE_COMMIT }}-${{ hashFiles('config/build-deps.txt', 'config/diffconfig', 'config/kernel-bpf.fragment', 'scripts/prepare-honk-build.sh', 'scripts/update-feeds-cache.sh', 'artifacts/logs/apt-package-versions.txt', 'source/.config', 'source/feeds.conf.default', 'source/.cache-feed-revisions') }}-

      - name: Normalize staging cache timestamps when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d source/staging_dir ]]; then
            if [[ ! -f source/.cache-staging-fingerprint ]] || ! cmp -s source/.cache-build-fingerprint.expected source/.cache-staging-fingerprint; then
              echo "Staging cache fingerprint mismatch; discarding restored staging directory"
              rm -rf source/staging_dir
              rm -f source/.cache-staging-fingerprint
            else
              find source/staging_dir -type f -exec touch {} +
              echo "Staging cache fingerprint verified; timestamps normalized"
            fi
          else
            echo "No staging cache restored; skipping timestamp normalization"
          fi

      - name: Restore compatible host tools and toolchain build cache
        id: tools-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            source/build_dir/host
            source/build_dir/toolchain-*
            source/.cache-tools-fingerprint
          key: tools-v2-${{ runner.os }}-${{ env.SOURCE_COMMIT }}-${{ env.OVERLAY_COMMIT }}-${{ env.HONK_COMMIT }}-${{ env.HONK_SOURCE_COMMIT }}-${{ hashFiles('config/build-deps.txt', 'config/diffconfig', 'config/kernel-bpf.fragment', 'scripts/prepare-honk-build.sh', 'scripts/update-feeds-cache.sh', 'artifacts/logs/apt-package-versions.txt', 'source/.config', 'source/feeds.conf.default', 'source/.cache-feed-revisions') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tools-v2-${{ runner.os }}-${{ env.SOURCE_COMMIT }}-${{ env.OVERLAY_COMMIT }}-${{ env.HONK_COMMIT }}-${{ env.HONK_SOURCE_COMMIT }}-${{ hashFiles('config/build-deps.txt', 'config/diffconfig', 'config/kernel-bpf.fragment', 'scripts/prepare-honk-build.sh', 'scripts/update-feeds-cache.sh', 'artifacts/logs/apt-package-versions.txt', 'source/.config', 'source/feeds.conf.default', 'source/.cache-feed-revisions') }}-

      - name: Validate host tools and toolchain cache fingerprint
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d source/build_dir/host ]] || compgen -G 'source/build_dir/toolchain-*' >/dev/null; then
            if [[ ! -f source/.cache-tools-fingerprint ]] || ! cmp -s source/.cache-build-fingerprint.expected source/.cache-tools-fingerprint; then
              echo "Host tools/toolchain cache fingerprint mismatch; discarding restored directories"
              rm -rf source/build_dir/host source/build_dir/toolchain-*
              rm -f source/.cache-tools-fingerprint
            else
              echo "Host tools/toolchain cache fingerprint verified"
            fi
          else
            echo "No host tools/toolchain cache restored"
          fi

      - name: Materialize verified cache fingerprints
        id: cache-fingerprint-ready
        shell: bash
        run: |
          set -euo pipefail
          cp source/.cache-build-fingerprint.expected source/.cache-staging-fingerprint
          cp source/.cache-build-fingerprint.expected source/.cache-tools-fingerprint

      - name: Report build cache footprint
        shell: bash
        run: |
          set -euo pipefail
          echo "Tools cache matched key: ${{ steps.tools-cache.outputs.cache-matched-key }}"
          for path in source/build_dir/host source/build_dir/toolchain-* source/staging_dir; do
            [[ -e "$path" ]] || continue
            du -sh "$path" || true
          done
      - name: Report cache restore results
        shell: bash
        run: |
          report_cache() {
            local name="$1" exact="$2" key="$3"
            if [[ "$exact" == true ]]; then echo "$name: exact hit ($key)"
            elif [[ -n "$key" ]]; then echo "$name: fallback restored ($key)"
            else echo "$name: miss"; fi
          }
          report_cache APT-archives "${{ steps.apt-cache-restore.outputs.cache-hit }}" "${{ steps.apt-cache-restore.outputs.cache-matched-key }}"
          report_cache APT-indexes "${{ steps.apt-index-cache.outputs.cache-hit }}" "${{ steps.apt-index-cache.outputs.cache-matched-key }}"
          report_cache OpenWrt-dl "${{ steps.dl-cache-restore.outputs.cache-hit }}" "${{ steps.dl-cache-restore.outputs.cache-matched-key }}"
          report_cache ccache "${{ steps.ccache-restore.outputs.cache-hit }}" "${{ steps.ccache-restore.outputs.cache-matched-key }}"
          report_cache Feeds "${{ steps.feeds-cache-restore.outputs.cache-hit }}" "${{ steps.feeds-cache-restore.outputs.cache-matched-key }}"
          report_cache Cargo "${{ steps.honk-cargo-cache.outputs.cache-hit }}" "${{ steps.honk-cargo-cache.outputs.cache-matched-key }}"
          report_cache Staging "${{ steps.staging-cache.outputs.cache-hit }}" "${{ steps.staging-cache.outputs.cache-matched-key }}"
          report_cache OpenWrt-Git "${{ steps.openwrt-git-cache.outputs.cache-hit }}" "${{ steps.openwrt-git-cache.outputs.cache-matched-key }}"
          report_cache Honk-Git "${{ steps.honk-git-cache.outputs.cache-hit }}" "${{ steps.honk-git-cache.outputs.cache-matched-key }}"
          report_cache Rust "${{ steps.rustup-cache-restore.outputs.cache-hit }}" "${{ steps.rustup-cache-restore.outputs.cache-matched-key }}"
          report_cache bpf-linker "${{ steps.bpf-linker-cache.outputs.cache-hit }}" "${{ steps.bpf-linker-cache.outputs.cache-matched-key }}"
          report_cache Host-tools "${{ steps.tools-cache.outputs.cache-hit }}" "${{ steps.tools-cache.outputs.cache-matched-key }}"
      - name: Download source archives with retry
        shell: bash
        run: |
          set -euo pipefail
          cd source
          mkdir -p dl
          echo "dl cache files before download: $(find dl -type f | wc -l)" | tee download.log
          du -sh dl 2>/dev/null | tee -a download.log || true
          START=$SECONDS
          if make download -j8 2>&1 | tee -a download.log; then
            echo "Download attempt 1 succeeded"
          else
            echo "Download attempt 1 failed; retrying with -j4"
            make download -j4 2>&1 | tee -a download.log
          fi
          echo "Source download elapsed: $((SECONDS-START)) seconds" | tee -a download.log
          echo "dl cache files after download: $(find dl -type f | wc -l)" | tee -a download.log
          du -sh dl 2>/dev/null | tee -a download.log || true

      - name: Configure swap and calculate compile parallelism
        shell: bash
        run: |
          set -euo pipefail
          AVAILABLE_GB=$(df -Pm / | awk 'NR==2 {print int($4/1024)}')
          if ! swapon --show | grep -q '/swapfile'; then
            SWAP_GB=0
            if [[ "$AVAILABLE_GB" -ge 12 ]]; then SWAP_GB=4; elif [[ "$AVAILABLE_GB" -ge 8 ]]; then SWAP_GB=2; fi
            if [[ "$SWAP_GB" -gt 0 ]]; then
              sudo fallocate -l "${SWAP_GB}G" /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=$((SWAP_GB*1024)) status=progress
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
            fi
          fi
          sudo sysctl -w vm.swappiness=10
          CPU_THREADS=$(nproc)
          RAM_MB=$(awk '/MemTotal/ {print int($2/1024)}' /proc/meminfo)
          RESERVED_MB=2048
          PER_JOB_MB=1500
          RAM_JOBS=$(( (RAM_MB-RESERVED_MB)/PER_JOB_MB ))
          (( RAM_JOBS < 1 )) && RAM_JOBS=1
          THREADS=$CPU_THREADS
          (( RAM_JOBS < THREADS )) && THREADS=$RAM_JOBS
          (( THREADS > 12 )) && THREADS=12
          echo "CPU threads: $CPU_THREADS" | tee source/resource-plan.log
          echo "RAM total: ${RAM_MB}MB; memory-based jobs: ${RAM_JOBS}; selected jobs: ${THREADS}" | tee -a source/resource-plan.log
          free -h | tee -a source/resource-plan.log
          swapon --show | tee -a source/resource-plan.log || true
          echo "--- filesystem capacity ---" | tee -a source/resource-plan.log
          df -hT / "$PWD" | tee -a source/resource-plan.log
          df -i / "$PWD" | tee -a source/resource-plan.log
          echo "COMPILE_THREADS=${THREADS}" >> "$GITHUB_ENV"

      - name: Compile firmware with resource monitoring and OOM-aware fallback
        id: firmware-compile
        shell: bash
        env:
          CCACHE_DIR: /home/runner/.cache/ccache
          CCACHE_LOGFILE: ${{ github.workspace }}/source/ccache-debug.log
        run: |
          set -uo pipefail
          cd source
          mkdir -p "$CCACHE_DIR"
          ccache -M 5G
          echo "ccache configuration:"
          ccache -p
          ccache -z
          echo "ccache status before build:"
          ccache -s
          THREADS="${COMPILE_THREADS:-1}"
          echo "Attempt 1: make -j${THREADS}"
          monitor_resources() {
            while true; do
              read -r total1 idle1 < <(awk '/^cpu / {print $2+$3+$4+$5+$6+$7+$8, $5+$6}' /proc/stat)
              sleep 1
              read -r total2 idle2 < <(awk '/^cpu / {print $2+$3+$4+$5+$6+$7+$8, $5+$6}' /proc/stat)
              total_delta=$((total2-total1))
              idle_delta=$((idle2-idle1))
              cpu_pct=0
              if (( total_delta > 0 )); then cpu_pct=$((100*(total_delta-idle_delta)/total_delta)); fi
              printf '%s CPU=%s%% ' "$(date -Is)" "$cpu_pct" >> resource-monitor.log
              awk '/MemAvailable/ {printf "MemAvailable=%dMB ", $2/1024} /SwapFree/ {printf "SwapFree=%dMB ", $2/1024}' /proc/meminfo >> resource-monitor.log
              printf 'Load=%s\n' "$(cat /proc/loadavg)" >> resource-monitor.log
              sleep 14
            done
          }
          monitor_resources & MONITOR_PID=$!
          trap 'kill "$MONITOR_PID" 2>/dev/null || true' EXIT
          START=$SECONDS
          if /usr/bin/time -v make -j"${THREADS}" 2>&1 | tee build-parallel.log; then
            echo "BUILD_RESULT=success-parallel" >> "$GITHUB_ENV"
          else
            if grep -Eiq 'out of memory|oom-kill|killed process|(^|[[:space:]])killed([[:space:]]|$)|fatal error:.*killed|cc1.*killed|signal 9|exit code 137' build-parallel.log; then
              echo "OOM/resource-related parallel failure; retrying incrementally with -j1"
              if /usr/bin/time -v make -j1 2>&1 | tee build-single.log; then
                echo "BUILD_RESULT=success-single" >> "$GITHUB_ENV"
              else
                echo "Serial retry failed; collecting verbose diagnostic output"
                /usr/bin/time -v make -j1 V=s 2>&1 | tee build-verbose.log
                echo "BUILD_RESULT=failure" >> "$GITHUB_ENV"
                exit 1
              fi
            else
              echo "Non-OOM compile failure; collecting focused MTK Wi-Fi driver diagnostics"
              /usr/bin/time -v make -j1 package/mtk/drivers/mt_wifi/compile V=s 2>&1 | tee build-mt-wifi-verbose.log || true
              echo "--- MTK Wi-Fi compiler diagnostics ---"
              grep -n -E -C 3 'error:|fatal error:|undefined reference|Error [0-9]|No rule to make target|not declared|compilation terminated|failed to build' build-mt-wifi-verbose.log | tail -160 || true
              echo "BUILD_RESULT=failure-parallel" >> "$GITHUB_ENV"
              exit 1
            fi          fi
          echo "Compile elapsed: $((SECONDS-START)) seconds" | tee -a resource-plan.log
          kill "$MONITOR_PID" 2>/dev/null || true
          wait "$MONITOR_PID" 2>/dev/null || true
          echo "ccache status after build (verbose reason counters):"
          ccache -s -v | tee ccache-stats.log
          echo "ccache result reasons will be summarized in the post-build diagnostics step."
          echo "ccache directory footprint:"
          du -sh "$CCACHE_DIR" || true
      - name: Verify compiled kernel BTF data
        shell: bash
        run: |
          set -euo pipefail
          cd source
          mkdir -p ../artifacts/logs
          DIAG=../artifacts/logs/btf-diagnostics.log
          : > "$DIAG"
          mapfile -t KERNEL_CONFIGS < <(find build_dir/target-* -path '*/linux-*/.config' -type f -print 2>/dev/null)
          if [[ "${#KERNEL_CONFIGS[@]}" -eq 0 ]]; then
            echo 'KERNEL BUILD ERROR: generated Linux kernel .config is missing; kernel build may have failed or stopped before configuration.' | tee -a "$DIAG"
            find build_dir/target-* -maxdepth 6 -type f \( -name '.config' -o -name 'vmlinux' \) -print 2>/dev/null | tee -a "$DIAG" || true
            exit 1
          fi
          CONFIG_OK=0
          for KERNEL_CONFIG in "${KERNEL_CONFIGS[@]}"; do
            echo "--- Generated kernel config: $KERNEL_CONFIG ---" | tee -a "$DIAG"
            grep -E '^(CONFIG_DEBUG_INFO|CONFIG_DEBUG_INFO_BTF|CONFIG_DEBUG_INFO_REDUCED)=' "$KERNEL_CONFIG" | tee -a "$DIAG" || true
            if grep -qx 'CONFIG_DEBUG_INFO=y' "$KERNEL_CONFIG" && grep -qx 'CONFIG_DEBUG_INFO_BTF=y' "$KERNEL_CONFIG"; then CONFIG_OK=1; fi
          done
          if [[ "$CONFIG_OK" -ne 1 ]]; then
            echo 'KERNEL CONFIGURATION ERROR: generated kernel .config does not enable both CONFIG_DEBUG_INFO and CONFIG_DEBUG_INFO_BTF. Check OpenWrt Kconfig dependencies and kernel config merge.' | tee -a "$DIAG"
            exit 1
          fi
          # Inspect only the actual kernel build ELF, not target-level marker files.
          mapfile -t VMLINUX_FILES < <(find build_dir/target-* -path '*/linux-*/linux-*/vmlinux' -type f -print 2>/dev/null)
          if [[ "${#VMLINUX_FILES[@]}" -eq 0 ]]; then
            echo 'KERNEL BUILD ERROR: no kernel-build vmlinux found.' | tee -a "$DIAG"
            find build_dir/target-* -maxdepth 7 -name vmlinux -print 2>/dev/null | tee -a "$DIAG" || true
            exit 1
          fi
          BTF_FOUND=0
          for VMLINUX in "${VMLINUX_FILES[@]}"; do
            echo "--- $VMLINUX ---" | tee -a "$DIAG"
            if ! readelf -h "$VMLINUX" >/dev/null 2>&1; then
              echo "KERNEL ARTIFACT ERROR: $VMLINUX is not ELF." | tee -a "$DIAG"
              continue
            fi
            if readelf -SW "$VMLINUX" | grep -Eq '[[:space:]]\.BTF([[:space:]]|$)'; then
              echo "PASS: .BTF section found in $VMLINUX" | tee -a "$DIAG"
              BTF_FOUND=1
            else
              echo "BTF MISSING: no .BTF section in $VMLINUX" | tee -a "$DIAG"
            fi
          done
          if [[ "$BTF_FOUND" -ne 1 ]]; then
            echo 'ARTIFACT CHECK ERROR: vmlinux exists but no image contains a .BTF section.' | tee -a "$DIAG"; exit 1
          fi
          echo 'PASS: compiled kernel contains BTF type information.' | tee -a "$DIAG"
      - name: Report target build directory footprint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "--- target build directory footprint ---"
          for path in source/build_dir/target-*; do
            [[ -e "$path" ]] || continue
            du -sh "$path" || true
            du -sh "$path"/* 2>/dev/null | sort -h | tail -20 || true
          done
          echo "--- remaining disk space ---"
          df -h / "$PWD"
      - name: Normalize APT archive cache permissions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          APT_CACHE=/home/runner/.cache/apt-archives
          if [[ ! -d "$APT_CACHE" ]]; then
            echo "APT archive cache does not exist; skipping normalization"
            exit 0
          fi

          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          # apt-get runs as root and may leave root-owned lock/partial files.
          # Return ownership to the runner so actions/cache/save can read them.
          sudo chown -R "$RUNNER_UID:$RUNNER_GID" "$APT_CACHE"
          sudo chmod -R u+rwX "$APT_CACHE"
          if [[ -d "$APT_CACHE/partial" ]]; then
            find "$APT_CACHE/partial" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          fi
          rm -f "$APT_CACHE/lock"
          echo "PASS: APT archive cache is readable and writable by $(id -un)"

      - name: Normalize APT package index cache permissions
        if: always() && steps.apt-install.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          LIST_CACHE=/home/runner/.cache/apt-lists
          if [[ -d "$LIST_CACHE" ]]; then
            sudo chown -R "$(id -u):$(id -g)" "$LIST_CACHE"
            sudo chmod -R u+rwX "$LIST_CACHE"
            rm -f "$LIST_CACHE/lock"
            if [[ -d "$LIST_CACHE/partial" ]]; then find "$LIST_CACHE/partial" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +; fi
          fi
      - name: Save APT package index cache
        if: always() && steps.apt-install.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/apt-lists
          key: apt-index-v1-${{ runner.os }}-ubuntu24-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save OpenWrt Git object cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/git/openwrt-source.git
          key: git-openwrt-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save Honk Git object cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/git/honk.git
          key: git-honk-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save pinned bpf-linker archive
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/bpf-linker
          key: bpf-linker-v1-${{ runner.os }}-0.11.0-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save pinned Rust toolchains
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.rustup/toolchains
          key: rustup-toolchains-v1-${{ runner.os }}-stable-1.99.1-nightly-2026-10-20-aarch64-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save APT archive cache
        if: always() && steps.apt-install.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/apt-archives
          key: apt-debs-v1-${{ runner.os }}-ubuntu24-${{ hashFiles('config/build-deps.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save source archive cache (always)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: source/dl
          key: openwrt-dl-v3-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save feeds repository cache
        if: always() && steps.feeds-update-install.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: source/feeds
          key: feeds-v3-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Collect ccache statistics
        if: always()
        shell: bash
        env:
          CCACHE_DIR: /home/runner/.cache/ccache
          CCACHE_LOGFILE: ${{ github.workspace }}/source/ccache-debug.log
        run: |
          mkdir -p source
          ccache -s | tee source/ccache-stats.log
          echo "--- ccache uncacheable result counters ---" | tee source/ccache-log-summary.log
          if [[ -s source/ccache-debug.log ]]; then
            awk '/Result: / { reason=$NF; if (reason !~ /^(local_storage_|direct_cache_|preprocessed_cache_|cache_(hit|miss)$)/) count[reason]++ } END { for (reason in count) printf "%8d %s\n", count[reason], reason }' source/ccache-debug.log | sort -nr | tee -a source/ccache-log-summary.log
          else
            echo 'No ccache debug log entries were recorded.' | tee -a source/ccache-log-summary.log
          fi
      - name: Save ccache (even after build failure)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/ccache
          key: ccache-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save Honk Cargo dependency cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner/.cargo/registry
            /home/runner/.cargo/git
          key: honk-cargo-v1-${{ runner.os }}-${{ hashFiles('source/feeds/daeuniverse/honk/Cargo.lock', 'source/feeds/daeuniverse/honk/crates/honk-ebpf/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save compatible staging cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            source/staging_dir
            source/.cache-staging-fingerprint
          key: staging-v2-${{ runner.os }}-${{ env.SOURCE_COMMIT }}-${{ env.OVERLAY_COMMIT }}-${{ env.HONK_COMMIT }}-${{ env.HONK_SOURCE_COMMIT }}-${{ hashFiles('config/build-deps.txt', 'config/diffconfig', 'config/kernel-bpf.fragment', 'scripts/prepare-honk-build.sh', 'scripts/update-feeds-cache.sh', 'artifacts/logs/apt-package-versions.txt', 'source/.config', 'source/feeds.conf.default', 'source/.cache-feed-revisions') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save host tools and toolchain build cache
        if: always() && steps.cache-fingerprint-ready.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            source/build_dir/host
            source/build_dir/toolchain-*
            source/.cache-tools-fingerprint
          key: tools-v2-${{ runner.os }}-${{ env.SOURCE_COMMIT }}-${{ env.OVERLAY_COMMIT }}-${{ env.HONK_COMMIT }}-${{ env.HONK_SOURCE_COMMIT }}-${{ hashFiles('config/build-deps.txt', 'config/diffconfig', 'config/kernel-bpf.fragment', 'scripts/prepare-honk-build.sh', 'scripts/update-feeds-cache.sh', 'artifacts/logs/apt-package-versions.txt', 'source/.config', 'source/feeds.conf.default', 'source/.cache-feed-revisions') }}-${{ github.run_id }}-${{ github.run_attempt }}


      - name: Generate build and cache diagnostics summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs
          {
            echo "# RAX3000M Honk build summary"
            echo
            echo "- Workflow run: ${GITHUB_RUN_ID:-unknown}"
            echo "- Source pin: ${SOURCE_COMMIT} (${SOURCE_REF})"
            echo "- Honk feed pin: ${HONK_COMMIT}"
            echo "- Honk source pin: ${HONK_SOURCE_COMMIT}"
            report_cache() {
              local name="$1" exact="$2" key="$3"
              if [[ "$exact" == true ]]; then echo "- $name: exact hit ($key)"
              elif [[ -n "$key" ]]; then echo "- $name: fallback restored ($key)"
              else echo "- $name: miss"; fi
            }
            report_cache APT-archives "${{ steps.apt-cache-restore.outputs.cache-hit }}" "${{ steps.apt-cache-restore.outputs.cache-matched-key }}"
            report_cache APT-indexes "${{ steps.apt-index-cache.outputs.cache-hit }}" "${{ steps.apt-index-cache.outputs.cache-matched-key }}"
            report_cache OpenWrt-Git "${{ steps.openwrt-git-cache.outputs.cache-hit }}" "${{ steps.openwrt-git-cache.outputs.cache-matched-key }}"
            report_cache OpenWrt-dl "${{ steps.dl-cache-restore.outputs.cache-hit }}" "${{ steps.dl-cache-restore.outputs.cache-matched-key }}"
            report_cache ccache "${{ steps.ccache-restore.outputs.cache-hit }}" "${{ steps.ccache-restore.outputs.cache-matched-key }}"
            report_cache Feeds "${{ steps.feeds-cache-restore.outputs.cache-hit }}" "${{ steps.feeds-cache-restore.outputs.cache-matched-key }}"
            report_cache Honk-Git "${{ steps.honk-git-cache.outputs.cache-hit }}" "${{ steps.honk-git-cache.outputs.cache-matched-key }}"
            report_cache Rust "${{ steps.rustup-cache-restore.outputs.cache-hit }}" "${{ steps.rustup-cache-restore.outputs.cache-matched-key }}"
            report_cache Cargo "${{ steps.honk-cargo-cache.outputs.cache-hit }}" "${{ steps.honk-cargo-cache.outputs.cache-matched-key }}"
            report_cache bpf-linker "${{ steps.bpf-linker-cache.outputs.cache-hit }}" "${{ steps.bpf-linker-cache.outputs.cache-matched-key }}"
            report_cache Staging "${{ steps.staging-cache.outputs.cache-hit }}" "${{ steps.staging-cache.outputs.cache-matched-key }}"
            report_cache Host-tools "${{ steps.tools-cache.outputs.cache-hit }}" "${{ steps.tools-cache.outputs.cache-matched-key }}"
            echo '## Cache footprints'
            for path in /home/runner/.cache/apt-archives /home/runner/.cache/apt-lists /home/runner/.cache/git/openwrt-source.git /home/runner/.cache/git/honk.git /home/runner/.cache/ccache /home/runner/.cache/bpf-linker /home/runner/.cargo/registry /home/runner/.cargo/git /home/runner/.rustup/toolchains source/dl source/feeds source/staging_dir source/build_dir/host source/build_dir/toolchain-*; do
              [[ -e "$path" ]] || continue
              du -sh "$path" || true
            done
            echo
            echo '## Feed revisions'
            if [[ -f source/.cache-feed-revisions ]]; then cat source/.cache-feed-revisions; else echo 'Feed manifest unavailable'; fi
            echo
            echo '## ccache statistics'
            if [[ -f source/ccache-stats.log ]]; then cat source/ccache-stats.log; else echo 'ccache statistics unavailable'; fi
            echo
            echo '## ccache uncacheable result reasons'
            if [[ -f source/ccache-log-summary.log ]]; then cat source/ccache-log-summary.log; else echo 'ccache reason summary unavailable'; fi
          } > artifacts/logs/build-summary.md
      - name: Verify and collect firmware artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs
          cp source/config-build-final.config artifacts/ 2>/dev/null || true
          cp source/feeds-update.log source/feeds-install.log source/defconfig.log source/download.log artifacts/logs/ 2>/dev/null || true
          cp source/build*.log source/ccache-stats.log source/ccache-log-summary.log source/resource-plan.log source/resource-monitor.log artifacts/logs/ 2>/dev/null || true
          if [[ "${{ job.status }}" != "success" && -s source/ccache-debug.log ]]; then
            gzip -1 -c source/ccache-debug.log > artifacts/logs/ccache-debug.log.gz
          fi
          cp source/config-build-final.config artifacts/logs/ 2>/dev/null || true
          if [[ "${{ job.status }}" == "success" && -d source/bin/targets/mediatek/filogic ]]; then
            cp -a source/bin/targets/mediatek/filogic/. artifacts/
          fi
          echo "--- collected files ---"
          find artifacts -type f -printf '%p %s bytes\n' || true
          if [[ "${{ job.status }}" == "success" ]]; then
            IMAGE="$(find artifacts -type f \( -name '*sysupgrade*' -o -name '*cmcc*' \) | head -n 1)"
            if [[ -z "${IMAGE}" ]]; then
              echo "ERROR: No NAND sysupgrade/device image found." >&2
              exit 1
            fi
            find artifacts -type f ! -name SHA256SUMS -print0 | xargs -0 sha256sum > artifacts/SHA256SUMS
            echo "Verified image candidate: ${IMAGE}"
          fi

      - name: Upload firmware and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rax3000m-nand-honk-firmware
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
