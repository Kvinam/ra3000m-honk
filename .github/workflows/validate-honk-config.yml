name: Validate Honk Full Configuration

on:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/validate-honk-config.yml'
  pull_request:
    paths:
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/validate-honk-config.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout configuration
        uses: actions/checkout@v4

      - name: Clone pinned ImmortalWrt source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=https://github.com/shiyu1314/openwrt-source
          REF=v25.12.6
          EXPECTED=8a3b1e99b158d88104dc8aecf1c98721ef87f3a3
          git clone --filter=blob:none --no-checkout "$SOURCE" source
          git -C source fetch --depth=1 origin "$REF"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"

      - name: Verify RAX3000M NAND source profile and DTS
        shell: bash
        run: |
          set -euo pipefail
          cd source
          IMAGE_FILE=target/linux/mediatek/image/filogic.mk
          DTS_FILE=target/linux/mediatek/dts/mt7981b-cmcc-rax3000m-nand.dts
          grep -q '^define Device/cmcc_rax3000m-nand$' "$IMAGE_FILE"
          grep -q '^TARGET_DEVICES += cmcc_rax3000m-nand$' "$IMAGE_FILE"
          grep -q 'DEVICE_DTS := mt7981b-cmcc-rax3000m-nand' "$IMAGE_FILE"
          test -f "$DTS_FILE"
          echo 'PASS: RAX3000M NAND profile definition and DTS verified.'

      - name: Prepare pinned Honk feed and BPF kernel config
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/prepare-honk-build.sh source/scripts/
          cp config/kernel-bpf.fragment source/config/
          cp config/diffconfig source/config/
          chmod +x source/scripts/prepare-honk-build.sh
          cd source
          bash scripts/prepare-honk-build.sh

      - name: Update and install all feeds (upstream reference order)
        shell: bash
        run: |
          set -euo pipefail
          cd source
          ./scripts/feeds update -a 2>&1 | tee feeds-update.log
          ./scripts/feeds install -a 2>&1 | tee feeds-install.log

      - name: Run defconfig and validate target and Honk packages
        shell: bash
        run: |
          set -euo pipefail
          cd source
          cp config/diffconfig .config
          make defconfig 2>&1 | tee defconfig.log
          required=(
            CONFIG_TARGET_mediatek
            CONFIG_TARGET_mediatek_filogic
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m_nand
            CONFIG_PACKAGE_honk
            CONFIG_PACKAGE_luci-app-honk
            CONFIG_PACKAGE_vmlinux-btf-builtin
            CONFIG_PACKAGE_kmod-veth
            CONFIG_PACKAGE_kmod-sched-core
            CONFIG_PACKAGE_kmod-sched-bpf
            CONFIG_PACKAGE_kmod-nft-core
            CONFIG_PACKAGE_kmod-nft-queue
            CONFIG_PACKAGE_kmod-nfnetlink-queue
            CONFIG_PACKAGE_kmod-nf-conntrack
          )
          failed=0
          for symbol in "${required[@]}"; do
            if grep -qx "${symbol}=y" .config; then
              echo "PASS: ${symbol}=y"
            else
              echo "FAIL: ${symbol} missing/not enabled"
              failed=1
            fi
          done
          echo '--- BPF/BTF kernel fragment checks ---'
          for symbol in CONFIG_BPF CONFIG_BPF_SYSCALL CONFIG_BPF_JIT CONFIG_NET_CLS_BPF CONFIG_NET_ACT_BPF CONFIG_NET_CLS_ACT CONFIG_NET_SCH_INGRESS CONFIG_VETH CONFIG_DEBUG_INFO CONFIG_DEBUG_INFO_BTF; do
            if grep -qx "${symbol}=y" config/kernel-bpf.fragment || grep -qx "${symbol}=m" config/kernel-bpf.fragment; then
              echo "PASS: ${symbol} requested"
            else
              echo "FAIL: ${symbol} missing from fragment"
              failed=1
            fi
          done
          if [[ "${failed}" -ne 0 ]]; then
            echo 'Validation failed.'
            exit 1
          fi
          echo '--- Device profile selection checks ---'

          device=CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m_nand
          if grep -qx "${device}=y" .config; then
            echo "PASS: ${device}=y selected"
          else
            echo "FAIL: ${device} not selected"
            failed=1
          fi
          for forbidden in CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m-emmc CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m-256m-nand; do
            if grep -qx "${forbidden}=y" .config; then
              echo "FAIL: unintended profile ${forbidden}=y"
              failed=1
            else
              echo "PASS: ${forbidden} not selected"
            fi
          done
          if [[ "${failed}" -ne 0 ]]; then
            echo 'Validation failed.'
            exit 1
          fi
          echo 'PASS: exact NAND profile, Honk package and BPF/BTF fragment checks.'
          echo 'No firmware compilation or publishing is performed.'

      - name: Upload config and feed diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: honk-defconfig-diagnostics
          path: |
            source/.config
            source/feeds-update.log
            source/feeds-install.log
            source/defconfig.log
            source/logs/feeds/daeuniverse/**/dump.txt
          if-no-files-found: warn
          retention-days: 7
