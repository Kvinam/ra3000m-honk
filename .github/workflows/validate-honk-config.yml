name: Validate Honk Full Configuration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout configuration
        uses: actions/checkout@v4

      - name: Clone pinned ImmortalWrt source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=https://github.com/shiyu1314/openwrt-source
          REF=v25.12.6
          EXPECTED=8a3b1e99b158d88104dc8aecf1c98721ef87f3a3
          git clone --filter=blob:none --no-checkout "$SOURCE" source
          git -C source fetch --depth=1 origin "$REF"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"

      - name: Prepare pinned Honk feed and BPF kernel config
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/prepare-honk-build.sh source/scripts/
          cp config/kernel-bpf.fragment source/config/
          cp config/diffconfig source/config/
          chmod +x source/scripts/prepare-honk-build.sh
          cd source
          bash scripts/prepare-honk-build.sh

      - name: Run defconfig and report missing selections
        shell: bash
        run: |
          set -uo pipefail
          cd source
          cp config/diffconfig .config
          if make defconfig; then
            echo 'make defconfig completed.'
          else
            echo 'make defconfig FAILED; will upload diagnostics.'
            exit 1
          fi
          required=(
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m-nand
            CONFIG_PACKAGE_honk
            CONFIG_PACKAGE_luci-app-honk
            CONFIG_PACKAGE_vmlinux-btf-builtin
            CONFIG_PACKAGE_kmod-sched-bpf
            CONFIG_PACKAGE_kmod-veth
          )
          missing=0
          for symbol in "${required[@]}"; do
            if grep -qx "${symbol}=y" .config; then
              echo "PASS: ${symbol}=y"
            else
              echo "MISSING: ${symbol} expected y; actual config:"
              grep -E "^${symbol}=(y|m)$|^# ${symbol} is not set$" .config || echo "  (symbol absent)"
              missing=1
            fi
          done
          echo '--- Relevant final .config symbols ---'
          grep -E '^(CONFIG_TARGET_(mediatek|mediatek_filogic|DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m-nand)|CONFIG_PACKAGE_(honk|luci-app-honk|vmlinux-btf-builtin|kmod-sched-bpf|kmod-veth))=|^# CONFIG_(TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m-nand|PACKAGE_(honk|luci-app-honk|vmlinux-btf-builtin|kmod-sched-bpf|kmod-veth)) is not set$' .config || true
          if [[ "$missing" -ne 0 ]]; then
            echo 'Defconfig validation failed: required symbols were not selected.'
            exit 1
          fi
          echo 'Honk Full package selection and NAND profile passed defconfig.'
          echo 'This workflow does not compile firmware or publish firmware images.'

      - name: Upload config and feed diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: honk-defconfig-diagnostics
          path: |
            source/.config
            source/logs/feeds/daeuniverse/**/dump.txt
          if-no-files-found: warn
          retention-days: 7
