name: Validate Honk Full Configuration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout configuration
        uses: actions/checkout@v4

      - name: Clone pinned ImmortalWrt source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=https://github.com/shiyu1314/openwrt-source
          REF=v25.12.6
          EXPECTED=8a3b1e99b158d88104dc8aecf1c98721ef87f3a3
          git clone --filter=blob:none --no-checkout "$SOURCE" source
          git -C source fetch --depth=1 origin "$REF"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"

      - name: Prepare pinned Honk feed and BPF kernel config
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/prepare-honk-build.sh source/scripts/
          cp config/kernel-bpf.fragment source/config/
          cp config/diffconfig source/config/
          chmod +x source/scripts/prepare-honk-build.sh
          cd source
          bash scripts/prepare-honk-build.sh

      - name: Update and install all feeds (upstream reference order)
        shell: bash
        run: |
          set -euo pipefail
          cd source
          ./scripts/feeds update -a 2>&1 | tee feeds-update.log
          ./scripts/feeds install -a 2>&1 | tee feeds-install.log

      - name: Run defconfig and report selected packages
        shell: bash
        run: |
          set -uo pipefail
          cd source
          cp config/diffconfig .config
          if make defconfig 2>&1 | tee defconfig.log; then
            echo 'make defconfig completed.'
          else
            echo 'make defconfig FAILED; will upload diagnostics.'
            exit 1
          fi
          required=(
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m-nand
          )
          missing=0
          for symbol in "${required[@]}"; do
            if grep -qx "${symbol}=y" .config; then
              echo "PASS: ${symbol}=y"
            else
              echo "MISSING: ${symbol} expected y; actual config:"
              grep -E "^${symbol}=(y|m)$|^# ${symbol} is not set$" .config || echo "  (symbol absent)"
              missing=1
            fi
          done
          echo '--- Honk and BPF related final .config selections ---'
          grep -E '^(CONFIG_PACKAGE_(honk|luci-app-honk|vmlinux-btf-builtin|kmod-sched-bpf|kmod-veth|kmod-sched-core|kmod-nft-core|kmod-nft-queue|kmod-nfnetlink-queue|kmod-nf-conntrack)|CONFIG_(BPF|BPF_SYSCALL|BPF_JIT|DEBUG_INFO|DEBUG_INFO_BTF|NET_CLS_BPF|NET_ACT_BPF|NET_CLS_ACT|NET_SCH_INGRESS|VETH))=|^# CONFIG_(PACKAGE_(honk|luci-app-honk|vmlinux-btf-builtin|kmod-sched-bpf|kmod-veth)|BPF|BPF_SYSCALL|BPF_JIT|DEBUG_INFO|DEBUG_INFO_BTF|NET_CLS_BPF|NET_ACT_BPF|NET_CLS_ACT|NET_SCH_INGRESS|VETH) is not set$' .config || true
          echo '--- Feed package parse diagnostics ---'
          grep -R -E 'ERROR: please fix feeds/daeuniverse|WARNING: No feed for package' logs/feeds/daeuniverse 2>/dev/null || true
          if [[ "$missing" -ne 0 ]]; then
            echo 'NAND profile validation failed.'
            exit 1
          fi
          echo 'NAND profile passed. Honk/BPF symbols are reported above for diagnostics.'
          echo 'This workflow does not compile firmware or publish firmware images.'

      - name: Upload config and feed diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: honk-defconfig-diagnostics
          path: |
            source/.config
            source/feeds-update.log
            source/feeds-install.log
            source/defconfig.log
            source/logs/feeds/daeuniverse/**/dump.txt
          if-no-files-found: warn
          retention-days: 7
